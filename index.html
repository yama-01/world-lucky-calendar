  .b-taian{ background:var(--badge-taian); }
  .b-mi{ background:var(--badge-mi); }
  .b-tora{ background:var(--badge-tora); }

  .ganzhi-theme-label{ font-size:11px; color:var(--sub); letter-spacing:.08em; margin-top:8px; }

      -0.00017*Math.sin(Omega) - 0.00007*Math.sin(Mp+2*M)
      +0.00004*Math.sin(2*Mp-2*F) + 0.00004*Math.sin(3*M)
      +0.00003*Math.sin(Mp+M-2*F) + 0.00003*Math.sin(2*Mp+2*F)
      -0.00003*Math.sin(Mp+M+2*F) + 0.00003*Math.sin(Mp-M+2*F)
      -0.00002*Math.sin(Mp-M-2*F) - 0.00002*Math.sin(3*Mp+M)
      +0.00002*Math.sin(4*Mp)
    );
    return jdToUtcMs(JDE+corr);
  }
  function kForDate(utcMs){
    var d = new Date(utcMs);
    var y = d.getUTCFullYear() + d.getUTCMonth()/12.0;
    return Math.floor((y-2000)*12.3685);
  }
  function newMoonOnOrBefore(utcMs){
    var k = Math.floor(kForDate(utcMs));
    while (newMoon(k) > utcMs) k -= 1;
    while (newMoon(k+1) <= utcMs) k += 1;
    return { k: k, ms: newMoon(k) };
  }
  function hasZhongqi(t0Ms,t1Ms){
    var lam0 = solarLongitude(t0Ms);
    var lam1 = solarLongitude(t1Ms);
    var idx0 = Math.floor(lam0/30);
    var lam1u = lam1>=lam0 ? lam1 : lam1+360;
    var idx1 = Math.floor(lam1u/30);
    return idx1>idx0;
  }
  function winterSolstice(year){
    return findAngleCrossing(270.0, Date.UTC(year,11,22,0,0,0));
  }
  function buildLunarYearMonths(year){
    var ws0 = winterSolstice(year-1);
    var ws1 = winterSolstice(year);
    var k0 = newMoonOnOrBefore(ws0).k;
    var k1 = newMoonOnOrBefore(ws1).k;
    var nMonths = k1-k0;
    var hasLeap = nMonths===13;
    var months=[];
    var monthNum=11;
    var leapAssigned=false;
    var k=k0;
    for (var idx=0; idx<nMonths; idx++){
      var start=newMoon(k), end=newMoon(k+1);
      var isLeap=false;
      if (hasLeap && !leapAssigned && idx!==0 && !hasZhongqi(start,end)){ isLeap=true; leapAssigned=true; }
      months.push({k:k,start:start,end:end,month:monthNum,leap:isLeap});
      if (!isLeap){ monthNum+=1; if (monthNum>12) monthNum=1; }
      k+=1;
    }
    return months;
  }
  function jstDateKey(utcMs){
    var shifted = new Date(utcMs+9*3600000);
    return Date.UTC(shifted.getUTCFullYear(), shifted.getUTCMonth(), shifted.getUTCDate());
  }
  var lunarCache = {};
  function lunarDate(year,month,day){
    var targetKey = Date.UTC(year,month-1,day);
    var candidates = [year, year-1, year+1];
    for (var ci=0; ci<candidates.length; ci++){
      var y = candidates[ci];
      if (!lunarCache[y]) lunarCache[y] = buildLunarYearMonths(y);
      var months = lunarCache[y];
      for (var mi=0; mi<months.length; mi++){
        var m = months[mi];
        var startKey = jstDateKey(m.start);
        var endKey = jstDateKey(m.end);
        if (startKey<=targetKey && targetKey<endKey){
          var dayNum = Math.round((targetKey-startKey)/86400000)+1;
          return { month:m.month, day:dayNum, leap:m.leap };
        }
      }
    }
    throw new Error("lunar date not found: "+year+"-"+month+"-"+day);
  }
  function rokuyo(year,month,day){
    var ld = lunarDate(year,month,day);
    return ROKUYO[mod(ld.month+ld.day,6)];
  }

  // 追加暦注。母倉日は節月基準の一般的な配当を使用。
  var DAIMYO_GANZHI = new Set("戊午 己巳 庚午 辛未 壬申 癸酉 丁丑 己卯 壬午 甲申 丁亥 壬辰 乙未 壬寅 甲辰 乙巳 丙午 丁未 己酉 庚戌 辛亥 丙辰 己未 庚申 辛酉".split(" "));
  var BOSO_BRANCHES = {
    "寅":["亥","子"],"卯":["亥","子"],"辰":["巳","午"],
    "巳":["寅","卯"],"午":["寅","卯"],"未":["巳","午"],
    "申":["丑","辰","未","戌"],"酉":["丑","辰","未","戌"],"戌":["巳","午"],
    "亥":["申","酉"],"子":["申","酉"],"丑":["巳","午"]
  };
  var GETTOKU_STEM = {"寅":"丙","午":"丙","戌":"丙","亥":"甲","卯":"甲","未":"甲","申":"壬","子":"壬","辰":"壬","巳":"庚","酉":"庚","丑":"庚"};
  var KENJO_NAMES = ["建日","除日","満日","平日","定日","執日","破日","危日","成日","収日","開日","閉日"];
  var KENJO_INFO = {
    "建日":["物事を建て始める日","🌱 始まり・挑戦"],
    "除日":["障害や不要なものを除く日","🧹 浄化・整理"],
    "満日":["満ち足りることを願う日","💰 金運・商売"],
    "平日":["物事を平らかに整える日","❤️ 人間関係"],
    "定日":["物事を定める日","🌱 始まり・挑戦"],
    "執日":["物事を執り行い保つ日",""],
    "破日":["破ることに意味がある日。一般の慶事には慎重に",""],
    "危日":["慎重さを大切にする日",""],
    "成日":["物事の成就を願う日","🌱 始まり・挑戦"],
    "収日":["収穫や収納を意識する日","💰 金運・商売"],
    "開日":["新しいことを開く日","🌱 始まり・挑戦"],
    "閉日":["物事を閉じてまとめる日",""]
  };
  var KENJO_FEATURED = new Set(["成日","開日","満日"]);
  // 十二直は節入りの日を前日と同じ直として数える方式を採用。
  // 既存の節月・日の干支を再利用する。
  function kenjoFor(y,m,d){
    var ms=Date.UTC(y,m-1,d,12)-9*3600000;
    var mg=monthGanzhiAt(ms), g=dayGanzhi(y,m,d);
    var idx=mod(DAY_BRANCHES.indexOf(g.branch)-DAY_BRANCHES.indexOf(mg.branch),12);
    return KENJO_NAMES[idx];
  }
  // Intlの中国暦は韓国旧暦と稀に日付差が生じるため、韓国暦の代替計算として暫定利用。
  var koreanLunarFormatter;
  try { koreanLunarFormatter=new Intl.DateTimeFormat("en-u-ca-chinese",{timeZone:"Asia/Seoul",day:"numeric",month:"numeric"}); } catch(e){}
  function koreanLuckyFor(y,m,d){
    if (!koreanLunarFormatter) return false;
    var parts=koreanLunarFormatter.formatToParts(new Date(Date.UTC(y,m-1,d,3)));
    var day=Number((parts.find(function(p){return p.type==="day";})||{}).value);
    return [9,10,19,20,29,30].indexOf(day)!==-1;
  }
  function worldInfoFor(y,m,d){
    var result=[];
    var name=kenjoFor(y,m,d);
    result.push({country:"🇨🇳 中国",name:"建除十二神・"+name,desc:KENJO_INFO[name][0],category:KENJO_INFO[name][1],featured:KENJO_FEATURED.has(name)});
    if(koreanLuckyFor(y,m,d))result.push({country:"🇰🇷 韓国",name:"ソンオムヌンナル（손 없는 날）",desc:"旧暦の日付の末尾が9または0となる、引っ越しや婚礼などの縁起を担ぐ日。※中国暦ベースの暫定判定です。",category:"🌱 始まり・挑戦・❤️ 人間関係",featured:true});
    return result;
  }

  function luckyDaysFor(year,month,day){
    var g = dayGanzhi(year,month,day);
    var ganzhi = g.stem+g.branch;
    var notifyUtc = Date.UTC(year,month-1,day,7,0,0) - 9*3600000;
    var mg = monthGanzhiAt(notifyUtc);
    var monthBranch = mg.branch;
    var result = [];
    if (ganzhi === TENSHA_SEASON[monthBranch]) result.push("天赦日");
    if (ICHIRYU_TABLE[monthBranch].indexOf(g.branch) !== -1) result.push("一粒万倍日");
    if (rokuyo(year,month,day)==="大安") result.push("大安");
    if (ganzhi==="己巳") result.push("己巳の日");
    else if (g.branch==="巳") result.push("巳の日");
    if (g.branch==="寅") result.push("寅の日");
    if (DAIMYO_GANZHI.has(ganzhi)) result.push("大明日");
    if ((BOSO_BRANCHES[monthBranch]||[]).indexOf(g.branch)!==-1) result.push("母倉日");
    if (GETTOKU_STEM[monthBranch]===g.stem) result.push("月徳日");
    return result;
  }
  function badgeClassFor(name){
    if (name==="天赦日") return "b-tensha";
    if (name==="一粒万倍日") return "b-ichiryu";
    if (name==="大安") return "b-taian";
    if (name==="己巳の日" || name==="巳の日") return "b-mi";
    if (name==="寅の日") return "b-tora";
    return "";
  }
  function badgeShortFor(name){
    if (name==="天赦日") return "天赦";
    if (name==="一粒万倍日") return "一粒万倍";
    if (name==="大安") return "大安";
    if (name==="己巳の日") return "己巳";
    if (name==="巳の日") return "巳";
    if (name==="寅の日") return "寅";
    return name;
  }

  // ---------- カレンダー描画 ----------
  var WEEKDAY_LABELS = ["日","月","火","水","木","金","土"];
  var now = new Date();
  var nowJst = new Date(now.getTime() + 9*3600000);
  var todayY = nowJst.getUTCFullYear(), todayM = nowJst.getUTCMonth()+1, todayD = nowJst.getUTCDate();

  var state = { year: todayY, month: todayM };

  function daysInMonth(y,m){ return new Date(Date.UTC(y, m, 0)).getUTCDate(); }

  function openGanzhiModal(ganzhi, dateText){
    var info = GANZHI_MEANINGS[ganzhi];
    if (!info) return;
    document.getElementById("ganzhiModalTitle").textContent = info.emoji + " " + ganzhi + "（" + info.reading + "）";
    document.getElementById("ganzhiModalTheme").textContent = info.theme.join("・");
    document.getElementById("ganzhiModalDesc").textContent = info.description;
    var parts = dateText.split("-").map(Number);
    var lucky = luckyDaysFor(parts[0], parts[1], parts[2]);
    var ordered = LUCKY_DAY_ORDER.filter(function(name){ return lucky.indexOf(name) !== -1; });
    var section = document.getElementById("ganzhiModalLucky");
    var items = document.getElementById("ganzhiModalLuckyItems");
    items.textContent = "";
    var world=worldInfoFor(parts[0],parts[1],parts[2]);
    section.hidden = ordered.length === 0 && world.length === 0;
    ordered.forEach(function(name){
      var item = document.createElement("div");
      item.className = "lucky-modal-item";
      var title = document.createElement("div");
      title.className = "lucky-modal-name";
      title.textContent = "🇯🇵 " + name;
      var desc = document.createElement("div");
      desc.className = "lucky-modal-description";
      desc.textContent = LUCKY_DAY_TEXT[name] || "";
      item.appendChild(title);
      item.appendChild(desc);
      items.appendChild(item);
    });
    world.filter(function(w){ return w.featured; }).forEach(function(w){
      var item=document.createElement("div"); item.className="lucky-modal-item";
      var title=document.createElement("div");title.className="lucky-modal-name";title.textContent=w.country+"｜"+w.name;
      var desc=document.createElement("div");desc.className="lucky-modal-description";desc.textContent=w.desc+(w.category?"（"+w.category+"）":"");
      item.appendChild(title);item.appendChild(desc);items.appendChild(item);
    });
    var modal = document.getElementById("ganzhiModal");
    modal.classList.add("open");
    modal.setAttribute("aria-hidden","false");
  }
  function closeGanzhiModal(){
    var modal = document.getElementById("ganzhiModal");
    modal.classList.remove("open");
    modal.setAttribute("aria-hidden","true");
  }

  function renderWeekdayRow(){
    var el = document.getElementById("weekdayRow");
    el.innerHTML = "";
    for (var i=0;i<7;i++){
      var d = document.createElement("div");
      d.className = "wd" + (i===0?" sun":(i===6?" sat":""));
      d.textContent = WEEKDAY_LABELS[i];
      el.appendChild(d);
    }
  }

  function renderHeaders(){
    var mh = monthHeaderInfo(state.year, state.month);
    document.getElementById("yearNum").textContent = state.year + "年";
    document.getElementById("yearGz").textContent = mh.yearGanzhi;
    document.getElementById("monthNum").textContent = state.month + "月";
    document.getElementById("monthGz").textContent = mh.monthGanzhi;
  }

  function renderGrid(){
    var grid = document.getElementById("calGrid");
    grid.innerHTML = "";
    var y = state.year, m = state.month;
    var firstWeekday = new Date(Date.UTC(y, m-1, 1)).getUTCDay();
    var nDays = daysInMonth(y,m);

    for (var i=0;i<firstWeekday;i++){
      var empty = document.createElement("div");
      empty.className = "cell empty";
      grid.appendChild(empty);
    }

    for (var d=1; d<=nDays; d++){
      var wd = new Date(Date.UTC(y, m-1, d)).getUTCDay();
      var cell = document.createElement("div");
      cell.className = "cell" + (wd===0?" sun":(wd===6?" sat":"")) +
        ((y===todayY && m===todayM && d===todayD) ? " today" : "");

      var dateLine = document.createElement("div");
      dateLine.className = "datenum";
      dateLine.textContent = d + "(" + WEEKDAY_LABELS[wd] + ")";
      cell.appendChild(dateLine);

      var g = dayGanzhi(y,m,d);
      var gzLine = document.createElement("div");
      gzLine.className = "ganzhi";
      gzLine.textContent = g.stem + g.branch;
      gzLine.setAttribute("role","button");
      gzLine.setAttribute("tabindex","0");
      gzLine.setAttribute("aria-label",(g.stem + g.branch) + "の意味を見る");
      gzLine.dataset.date = [y,m,d].join("-");
      gzLine.addEventListener("click", function(){ openGanzhiModal(this.textContent, this.dataset.date); });
      gzLine.addEventListener("keydown", function(e){ if (e.key === "Enter" || e.key === " "){ e.preventDefault(); openGanzhiModal(this.textContent, this.dataset.date); } });
      cell.appendChild(gzLine);

      var sekki = isSekkiiriDay(y,m,d);
      if (sekki.isSekki){
        var sekkiLine = document.createElement("div");
        sekkiLine.className = "sekki";
        sekkiLine.textContent = "節入り→" + sekki.after.stem + sekki.after.branch;
        cell.appendChild(sekkiLine);
      }

      var lucky = luckyDaysFor(y,m,d);
      if (lucky.length){
        var ordered = LUCKY_DAY_ORDER.filter(function(n){ return lucky.indexOf(n)!==-1; });
        var badgesWrap = document.createElement("div");
        badgesWrap.className = "badges";
        ordered.slice(0,2).forEach(function(name){
          var b = document.createElement("span");
          b.className = "badge " + badgeClassFor(name);
          b.textContent = badgeShortFor(name);
          b.title = name + "：" + (LUCKY_DAY_TEXT[name] || "");
          badgesWrap.appendChild(b);
        });
        if(ordered.length>2){var more=document.createElement("span");more.className="badge b-more";more.textContent="+"+(ordered.length-2);badgesWrap.appendChild(more);}
        cell.appendChild(badgesWrap);
      }


      var world=worldInfoFor(y,m,d);
      var featured=world.filter(function(w){return w.featured;});
      if(featured.length){var flags=document.createElement("div");flags.className="world-flags";flags.textContent=featured.map(function(w){return w.country.slice(0,4);}).join(" ");cell.appendChild(flags);}
      cell.setAttribute("tabindex","0");cell.setAttribute("role","button");cell.setAttribute("aria-label",d+"日の詳細を開く");
      cell.addEventListener("click",function(e){if(e.target.classList.contains("ganzhi"))return;var g=this.querySelector(".ganzhi");openGanzhiModal(g.textContent,g.dataset.date);});
      cell.addEventListener("keydown",function(e){if(e.target!==this)return;if(e.key==="Enter"||e.key===" "){e.preventDefault();var g=this.querySelector(".ganzhi");openGanzhiModal(g.textContent,g.dataset.date);}});
      grid.appendChild(cell);
    }
  }

  function render(){
    renderHeaders();
    renderGrid();
  }

  function loadMonth(){ render(); }

  document.getElementById("yearPrev").addEventListener("click", function(){
    state.year -= 1; loadMonth();
  });
  document.getElementById("yearNext").addEventListener("click", function(){
    state.year += 1; loadMonth();
  });
  document.getElementById("monthPrev").addEventListener("click", function(){
    state.month -= 1;
    if (state.month < 1){ state.month = 12; state.year -= 1; }
    loadMonth();
  });
  document.getElementById("monthNext").addEventListener("click", function(){
    state.month += 1;
    if (state.month > 12){ state.month = 1; state.year += 1; }
    loadMonth();
  });

  document.getElementById("ganzhiClose").addEventListener("click", closeGanzhiModal);
  document.getElementById("ganzhiModal").addEventListener("click", function(e){ if (e.target === this) closeGanzhiModal(); });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeGanzhiModal(); });

  renderWeekdayRow();
  loadMonth();
})();
</script>
